[package]
name = "axum-problem"
description = "RFC 9457 problem details for axum — #[derive(AxumProblem)] converts your error enums to structured HTTP error responses"
keywords = ["axum", "error", "rfc9457", "problem-details", "derive"]
categories = ["web-programming", "rust-patterns"]
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum-problem-derive = { version = "0.1", path = "../axum-problem-derive" }
axum = { version = "0.7", default-features = false }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tower-layer = "0.3"
tower = { version = "0.4", default-features = false }

[dev-dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
thiserror = "2"
futures = "0.3"
